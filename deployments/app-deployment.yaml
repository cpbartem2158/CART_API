apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-api
  template:
    metadata:
      labels:
        app: cart-api
    spec:
      containers:
        - name: app
          image: cart-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 0
          envFrom:
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            tcpSocket:
              port: 0
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 0
            initialDelaySeconds: 10
            periodSeconds: 10
