# Скопируйте в values-qa.yaml и задайте реальные значения:
#   cp helm/values-qa.example.yaml helm/values-qa.yaml

namespace: qa

replicas: 2
minReplicas: 2
maxReplicas: 5

postgresql:
  storage: 1Gi

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

ingress:
  host: qa.cart-api.local

secret:
  postgresPassword: changeme
