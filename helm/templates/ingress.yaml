apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cart-api-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cart-api
                port:
                  number: {{ .Values.app.port }}